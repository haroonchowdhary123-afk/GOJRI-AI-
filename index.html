<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gogri AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101c;
  color: white;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  margin: auto;
}

header {
  padding: 16px;
  background: #191929;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #33334a;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #a78bfa;
}

#newChat {
  background: #303047;
  color: white;
  border: 0;
  padding: 10px 14px;
  border-radius: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.welcome {
  text-align: center;
  margin-top: 15vh;
}

.welcome h1 {
  font-size: 32px;
}

.message {
  padding: 12px 15px;
  margin: 12px 0;
  border-radius: 16px;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #6948c8;
  margin-left: auto;
}

.ai {
  background: #252538;
  margin-right: auto;
}

footer {
  padding: 12px;
  background: #191929;
}

form {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #44445c;
  background: #10101c;
  color: white;
  font-size: 16px;
}

.send {
  background: #7954df;
  color: white;
  border: 0;
  border-radius: 14px;
  padding: 0 18px;
  font-size: 20px;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.buttons button {
  flex: 1;
  padding: 10px;
  border: 0;
  border-radius: 12px;
  background: #303047;
  color: white;
}

small {
  display: block;
  text-align: center;
  color: #9999b0;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">

  </div>

</header>

<div id="chat">

    <p>Main Gogri AI hoon.</p>
    <p>Mujhse kuch bhi poochho.</p>
  </div>

</div>

<footer>

<form id="chatForm">

<input
  id="message"
  type="text"
  placeholder="Gogri AI se kuch poochho..."
  autocomplete="off"
  required
>

<button class="send" type="submit">➤</button>

</form>

<div class="buttons">

<button id="mic">🎤 Voice</button>

<button id="speak">🔊 Suno</button>

</div>

<small>Gogri AI • Hindi • Hinglish • English</small>

</footer>

</div>
